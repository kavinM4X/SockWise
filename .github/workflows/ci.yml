name: SockWise CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  ci-and-publish:
    name: Build, Validate & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Lint Frontend
        working-directory: client
        run: npm run lint

      - name: Build Frontend
        working-directory: client
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Validate Backend JavaScript Syntax
        working-directory: server
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            function getJsFiles(dir) {
              let results = [];
              const list = fs.readdirSync(dir);
              for (const file of list) {
                const fullPath = path.join(dir, file);
                if (file === 'node_modules') continue;
                const stat = fs.statSync(fullPath);
                if (stat && stat.isDirectory()) {
                  results = results.concat(getJsFiles(fullPath));
                } else if (file.endsWith('.js')) {
                  results.push(fullPath);
                }
              }
              return results;
            }
            const files = getJsFiles('.');
            console.log(\`Validating \${files.length} JavaScript files...\`);
            for (const file of files) {
              execSync(\`node --check \${file}\`, { stdio: 'inherit' });
            }
            console.log('All backend JavaScript files validated successfully.');
          "

      - name: Prepare CI Environment for Docker Compose
        run: |
          cp server/.env.example server/.env

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sockwise-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sockwise-frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-cd:
    name: Continuous Deployment (Self-Hosted)
    needs: ci-and-publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Deployment Compose Configuration
        run: docker compose -f docker-compose.ghcr.yml config

      - name: Pull GHCR Container Images
        run: docker compose -f docker-compose.ghcr.yml pull

      - name: Deploy Containers from GHCR
        run: docker compose -f docker-compose.ghcr.yml up -d --no-build

      - name: Verify Running Containers
        run: docker compose -f docker-compose.ghcr.yml ps

      - name: Verify Application Health Check
        shell: powershell
        run: |
          $maxAttempts = 10
          $attempt = 0
          $healthy = $false
          while ($attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "Checking /api/health (Attempt $attempt of $maxAttempts)..."
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/api/health" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "Backend health check PASSED with HTTP 200."
                $healthy = $true
                break
              }
            } catch {
              Write-Host "Health check attempt $attempt failed: $_"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) {
            Write-Error "Deployment health check failed after $maxAttempts attempts."
            exit 1
          }

      - name: Verify Frontend Web Application
        shell: powershell
        run: |
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing -TimeoutSec 5
            if ($response.StatusCode -eq 200) {
              Write-Host "Frontend web check PASSED with HTTP 200."
            } else {
              Write-Error "Frontend web check failed with status $($response.StatusCode)"
              exit 1
            }
          } catch {
            Write-Error "Frontend web check failed: $_"
            exit 1
          }

      - name: Verify Observability Stack
        shell: powershell
        run: |
          $required = @("sockwise-prometheus", "sockwise-grafana", "sockwise-loki", "sockwise-alloy", "sockwise-tempo", "sockwise-cadvisor")
          $running = docker ps --format "{{.Names}}"
          foreach ($svc in $required) {
            if ($running -notcontains $svc) {
              Write-Error "Observability service $svc is not running!"
              exit 1
            }
          }
          Write-Host "All 6 observability services verified active and running."

      - name: Deployment Summary
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Deployment commit: ${{ github.sha }}"
          Write-Host "Backend image: ghcr.io/${{ github.repository_owner }}/sockwise-backend:sha-${{ github.sha }}"
          Write-Host "Frontend image: ghcr.io/${{ github.repository_owner }}/sockwise-frontend:sha-${{ github.sha }}"
          Write-Host "Deployment status: SUCCESS"
          Write-Host "=========================================="
