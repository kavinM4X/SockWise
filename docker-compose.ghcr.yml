services:
  backend:
    image: ghcr.io/kavinm4x/sockwise-backend:${IMAGE_TAG:-sha-c55ceef}
    container_name: sockwise-backend
    hostname: sockwise-backend
    restart: unless-stopped
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - PORT=5000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_SERVICE_NAME=sockwise-backend
    depends_on:
      - tempo
    networks:
      - sockwise-network

  frontend:
    image: ghcr.io/kavinm4x/sockwise-frontend:${IMAGE_TAG:-sha-c55ceef}
    container_name: sockwise-frontend
    hostname: sockwise-frontend
    restart: unless-stopped
    networks:
      - sockwise-network

  nginx:
    image: nginx:alpine
    container_name: sockwise-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sockwise-network

  prometheus:
    image: prom/prometheus:latest
    container_name: sockwise-prometheus
    hostname: sockwise-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - sockwise-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sockwise-cadvisor
    hostname: sockwise-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sockwise-network

  grafana:
    image: grafana/grafana:latest
    container_name: sockwise-grafana
    hostname: sockwise-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - sockwise-network

  loki:
    image: grafana/loki:latest
    container_name: sockwise-loki
    hostname: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - sockwise-network

  tempo:
    image: grafana/tempo:latest
    container_name: sockwise-tempo
    hostname: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - sockwise-network

  alloy:
    image: grafana/alloy:latest
    container_name: sockwise-alloy
    hostname: alloy
    restart: unless-stopped
    user: root
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - sockwise-network

volumes:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  sockwise-network:
    driver: bridge
