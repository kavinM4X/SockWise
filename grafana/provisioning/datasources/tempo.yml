apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'P8E80F9AEF21F6940'
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceId: false
        filterBySpanId: false
        customQuery: true
        query: '{container="sockwise-backend"} |= "$${__trace.id}"'
      serviceMap:
        datasourceUid: 'PBFA97CFB590B2093'
